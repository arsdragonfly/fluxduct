[package]
name = "fluxduct-rs"
version = "0.1.0"
license = "MIT"
edition = "2024"
exclude = ["index.node"]

[lib]
crate-type = ["cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }
typeshare = "1.0.0"

[dependencies.neon]
version = "1.1"
features = ["napi-8", "serde", "tokio"]
