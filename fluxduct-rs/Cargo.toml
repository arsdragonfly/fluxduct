[package]
name = "fluxduct-rs"
version = "0.1.0"
license = "MIT"
edition = "2024"
exclude = ["index.node"]

[lib]
crate-type = ["cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
pipewire = { git = "https://gitlab.freedesktop.org/pipewire/pipewire-rs.git", version = "0.9.2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1"
napi = { version = "2", features = ["serde-json", "tokio_rt"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
